<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NN 3D Viz Lab</title>
  <link rel="stylesheet" href="src/engine/lab.css" />
  <script>
    try {
      var t = new URLSearchParams(location.search).get('theme');
      if (!/^(black|gray|green|white)$/.test(t || '')) t = localStorage.getItem('nnlab-theme');
      if (/^(black|gray|green|white)$/.test(t || '')) document.documentElement.dataset.theme = t;
      // Масштаб интерфейса (та же логика, что в theme.js): ?scale=, затем сохранённый, по умолчанию 2; на узких экранах — меньше
      var s = parseFloat(new URLSearchParams(location.search).get('scale'));
      if (!isFinite(s)) s = parseFloat(localStorage.getItem('nnlab-scale'));
      s = isFinite(s) ? Math.min(3, Math.max(0.75, s)) : 2;
      var w = innerWidth;
      document.documentElement.style.setProperty('--ui-scale', String(w < 600 ? Math.min(s, 1) : w < 900 ? Math.min(s, 1.2) : w < 1280 ? Math.min(s, 1.5) : s));
    } catch (e) {}
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Содержимое панели и сцены строит движок по конфигу spaces/<id>.js -->
  <aside id="sidebar"><p class="muted">Загрузка пространства…</p></aside>
  <main id="scene"></main>
  <script type="module" src="src/engine/boot.js"></script>
</body>
</html>
