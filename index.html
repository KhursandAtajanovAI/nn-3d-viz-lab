<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NN 3D Viz Lab</title>
  <meta name="description" content="" data-t-content="catalog.metaDescription" />
  <link rel="stylesheet" href="src/hub/hub.css" />
  <script>
    try {
      var t = new URLSearchParams(location.search).get('theme');
      if (!/^(black|gray|green|white)$/.test(t || '')) t = localStorage.getItem('nnlab-theme');
      if (/^(black|gray|green|white)$/.test(t || '')) document.documentElement.dataset.theme = t;
      // Масштаб интерфейса (та же логика, что в theme.js): ?scale=, затем сохранённый, по умолчанию 2; на узких экранах — меньше
      var s = parseFloat(new URLSearchParams(location.search).get('scale'));
      if (!isFinite(s)) s = parseFloat(localStorage.getItem('nnlab-scale'));
      s = isFinite(s) ? Math.min(3, Math.max(0.75, s)) : 2;
      var w = innerWidth;
      document.documentElement.style.setProperty('--ui-scale', String(w < 600 ? Math.min(s, 1) : w < 900 ? Math.min(s, 1.2) : w < 1280 ? Math.min(s, 1.5) : s));
    } catch (e) {}
  </script>
  <!-- Конфиги пространств обычно не используют Three.js, но если используют — импорт будет работать и здесь -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="hero-top">
        <h1>NN 3D Viz Lab <span class="accent">·</span> <span data-t="catalog.heroTitle"></span></h1>
        <div id="theme-switch"></div>
      </div>
      <p data-t="catalog.heroText"></p>
      <p class="stats"><span data-t="catalog.statsSpaces"></span> <b id="total">…</b> · <span data-t="catalog.statsCategories"></span> <b id="total-categories">…</b></p>
    </header>

    <section id="my-spaces" class="my-spaces" aria-labelledby="my-title">
      <div class="my-head">
        <h2 id="my-title"><span class="icon">✎</span> <span data-t="my.title"></span></h2>
        <div class="my-buttons">
          <button type="button" id="import-space" class="ghost-btn" data-t="my.import" data-t-title="my.importHint"></button>
          <button type="button" id="create-space" class="primary-btn" data-t="my.create"></button>
        </div>
      </div>
      <p id="my-msg" class="my-msg" role="status"></p>
      <p class="muted" data-t="my.intro"></p>
      <div id="my-list"></div>
    </section>

    <div class="toolbar" id="toolbar">
      <div class="search-wrap">
        <input id="search" type="search" data-t-placeholder="catalog.searchPlaceholder" data-t-aria-label="catalog.searchLabel" autocomplete="off" />
      </div>
      <nav id="filters" data-t-aria-label="catalog.categoriesLabel"></nav>
    </div>

    <details class="tag-panel">
      <summary data-t="catalog.tagFilter"></summary>
      <div id="tag-cloud" data-t-aria-label="catalog.tagsLabel"></div>
    </details>

    <div class="status-row">
      <span id="result-count" class="muted" role="status"></span>
      <div id="active-filters"></div>
    </div>

    <main id="catalog"><p class="muted">…</p></main>

    <footer>
      <p data-t="catalog.footerSpacesHtml"></p>
      <p><span data-t="catalog.footerBadges"></span> <span class="badge fidelity real" data-t="fid.real.title"></span>
        <span class="badge fidelity trained" data-t="fid.trained.title"></span>
        <span class="badge fidelity demo" data-t="fid.demo.title"></span> <span data-t="catalog.footerBadgesTail"></span></p>
      <p><span data-t="catalog.footerDemo"></span> <a href="examples/simple-demo/">examples/simple-demo</a>.</p>
    </footer>
  </div>
  <script type="module" src="src/hub/hub.js"></script>
</body>
</html>
